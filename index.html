<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Send Photos to Satish</title>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Arial, sans-serif;
    background: #f0f4ff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: white;
    border-radius: 20px;
    padding: 32px 24px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.12);
  }
  h1 { font-size: 22px; color: #222; margin-bottom: 6px; }
  .sub { color: #888; font-size: 14px; margin-bottom: 24px; }
  label { display: block; font-size: 13px; font-weight: bold; color: #444; margin-bottom: 6px; }
  input[type="text"] {
    width: 100%;
    padding: 12px;
    border: 1.5px solid #ddd;
    border-radius: 10px;
    font-size: 15px;
    margin-bottom: 16px;
    outline: none;
  }
  input[type="text"]:focus { border-color: #6c63ff; }
  .upload-area {
    border: 2px dashed #ccc;
    border-radius: 12px;
    padding: 28px;
    text-align: center;
    cursor: pointer;
    position: relative;
    margin-bottom: 16px;
    transition: border-color 0.2s;
  }
  .upload-area:hover { border-color: #6c63ff; }
  .upload-area input {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
  }
  .upload-area .icon { font-size: 32px; margin-bottom: 8px; }
  .upload-area p { color: #888; font-size: 14px; }
  .upload-area strong { color: #6c63ff; display: block; margin-bottom: 4px; }
  .preview {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
  }
  .preview img {
    width: 70px;
    height: 70px;
    object-fit: cover;
    border-radius: 8px;
    border: 2px solid #eee;
  }
  .count { font-size: 13px; color: #6c63ff; font-weight: bold; margin-bottom: 4px; }
  .btn {
    width: 100%;
    padding: 14px;
    background: #6c63ff;
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn:hover { background: #5548e0; }
  .btn:disabled { background: #aaa; cursor: not-allowed; }
  .msg {
    margin-top: 14px;
    padding: 12px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: bold;
    text-align: center;
    display: none;
  }
  .msg.success { background: #e8f5e9; color: #2e7d32; display: block; }
  .msg.error { background: #ffebee; color: #c62828; display: block; }
</style>
</head>
<body>
<div class="card">
  <h1>📸 Send Photos to Satish</h1>
  <p class="sub">Select your images — they'll go straight to Satish's email!</p>

  <label>Your Name</label>
  <input type="text" id="name" placeholder="Enter your name" />

  <label>Select Images (max 5)</label>
  <div class="upload-area">
    <input type="file" id="fileInput" accept="image/*" multiple onchange="handleFiles(this.files)" />
    <div class="icon">🖼️</div>
    <strong>Tap to choose images</strong>
    <p>JPG, PNG, WEBP supported</p>
  </div>

  <div class="preview" id="preview"></div>
  <div class="count" id="count"></div>

  <button class="btn" id="btn" onclick="send()">Send Images →</button>
  <div class="msg" id="msg"></div>
</div>

<script>
  // ✅ Your EmailJS Keys
  const PUBLIC_KEY  = "E8xU2pugqGfovcVEs";
  const SERVICE_ID  = "service_wopevee";
  const TEMPLATE_ID = "template_8vp3lvc";
  const TO_EMAIL    = "satishgadagi23@gmail.com";

  emailjs.init(PUBLIC_KEY);

  let files = [];

  function handleFiles(input) {
    files = Array.from(input).slice(0, 5);
    const preview = document.getElementById('preview');
    const count = document.getElementById('count');
    preview.innerHTML = '';
    files.forEach(f => {
      const img = document.createElement('img');
      img.src = URL.createObjectURL(f);
      preview.appendChild(img);
    });
    count.textContent = files.length > 0 ? files.length + ' image(s) selected' : '';
  }

  async function send() {
    const name = document.getElementById('name').value.trim();
    const btn  = document.getElementById('btn');
    const msg  = document.getElementById('msg');
    msg.className = 'msg';

    if (!name) { showMsg('error', '⚠️ Please enter your name!'); return; }
    if (files.length === 0) { showMsg('error', '⚠️ Please select at least one image!'); return; }

    btn.disabled = true;
    btn.textContent = 'Sending...';

    const list = files.map((f,i) => (i+1)+'. '+f.name+' ('+( f.size/1024).toFixed(1)+' KB)').join('\n');

    const params = {
      to_email:    TO_EMAIL,
      from_name:   name,
      image_count: files.length,
      images_html: '<pre style="font-size:14px;line-height:1.8;">'+list+'</pre>',
      message:     name + ' sent you ' + files.length + ' photo(s):\n' + list
    };

    try {
      const result = await emailjs.send(SERVICE_ID, TEMPLATE_ID, params);
      console.log('SUCCESS', result);
      showMsg('success', '✅ Sent successfully! Satish will receive your photos.');
      files = [];
      document.getElementById('preview').innerHTML = '';
      document.getElementById('count').textContent = '';
      document.getElementById('name').value = '';
      document.getElementById('fileInput').value = '';
    } catch(err) {
      console.error('FAILED', JSON.stringify(err));
      showMsg('error', '❌ Error: ' + (err.text || JSON.stringify(err)));
    }

    btn.disabled = false;
    btn.textContent = 'Send Images →';
  }

  function showMsg(type, text) {
    const msg = document.getElementById('msg');
    msg.className = 'msg ' + type;
    msg.textContent = text;
  }
</script>
</body>
</html>
